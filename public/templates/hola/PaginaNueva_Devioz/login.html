<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIOZ — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  html,body{height:100%}
  body{
    background:#060c14;
    color:#e6f1f5;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background-image:
      radial-gradient(1000px 600px at -10% -20%, rgba(45,212,191,0.18), transparent 60%),
      radial-gradient(900px 600px at 110% 110%, rgba(34,211,238,0.12), transparent 55%),
      linear-gradient(rgba(45,212,191,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,212,191,0.04) 1px, transparent 1px);
    background-size: auto, auto, 36px 36px, 36px 36px;
    overflow:hidden;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 50%, transparent 0, rgba(0,0,0,0.4) 100%);
    pointer-events:none;
  }
  .shell{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background: linear-gradient(160deg, #0f1e2e, #0a1521);
    border: 1px solid rgba(45,212,191,0.22);
    border-radius:18px;
    padding:36px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(45,212,191,0.05) inset;
    backdrop-filter: blur(10px);
  }
  .brand{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin-bottom:6px;
  }
  .brand-mark{
    width:46px; height:46px; border-radius:14px;
    background: linear-gradient(135deg, #2dd4bf, #22d3ee);
    color:#042024; font-weight:800; font-size:22px;
    display:grid; place-items:center;
    font-family:'Space Grotesk',sans-serif;
    box-shadow: 0 10px 28px rgba(45,212,191,0.4);
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px; letter-spacing:2px; font-weight:700;
  }
  .sub{
    text-align:center; color:#7a93a5; font-size:12px;
    letter-spacing:2px; text-transform:uppercase;
    margin: 8px 0 28px;
  }
  label{
    display:block; font-size:12px; font-weight:600;
    color:#a4b7c4; margin-bottom:6px; letter-spacing:0.3px;
  }
  .input-wrap{ position:relative; margin-bottom:18px; }
  input{
    width:100%; padding:13px 16px;
    background:#06121a; color:#e6f1f5;
    border:1px solid rgba(45,212,191,0.18);
    border-radius:10px;
    font-size:14px; outline:none;
    transition:.18s;
  }
  input:focus{
    border-color:#2dd4bf;
    box-shadow:0 0 0 4px rgba(45,212,191,0.12);
  }
  button.submit{
    width:100%; padding:13px;
    background:linear-gradient(135deg,#2dd4bf,#22d3ee);
    color:#042024; border:none; cursor:pointer;
    border-radius:10px; font-weight:700; font-size:14px;
    letter-spacing:1.2px; text-transform:uppercase;
    transition:.2s;
    box-shadow:0 12px 28px rgba(45,212,191,0.35);
  }
  button.submit:hover{ transform:translateY(-2px); box-shadow:0 18px 36px rgba(45,212,191,0.5); }
  .error{
    background:rgba(239,68,68,0.12); color:#fca5a5;
    border:1px solid rgba(239,68,68,0.35);
    padding:10px 14px; border-radius:10px;
    font-size:13px; margin-bottom:16px; display:none;
  }
  .foot{
    margin-top:22px; text-align:center; font-size:12px; color:#7a93a5;
  }
  .foot a{ color:#2dd4bf; text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
  .hint-credentials{
    margin-top:18px; padding:12px;
    background:rgba(45,212,191,0.06);
    border:1px dashed rgba(45,212,191,0.25);
    border-radius:10px;
    font-size:11.5px; color:#7a93a5; text-align:center;
  }
  .hint-credentials code{ color:#2dd4bf; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="brand-mark">D</div>
      <h1>DEVIOZ</h1>
    </div>
    <p class="sub">Panel Administrador</p>

    <div class="error" id="error">Usuario o contraseña incorrectos</div>

    <label for="usuario">Usuario</label>
    <div class="input-wrap"><input type="text" id="usuario" placeholder="admin" autocomplete="username" /></div>

    <label for="password">Contraseña</label>
    <div class="input-wrap"><input type="password" id="password" placeholder="••••••••" autocomplete="current-password" /></div>

    <button class="submit" onclick="login()">Ingresar al panel</button>

    <div class="hint-credentials">
      Demo local: usuario <code>admin</code> · contraseña <code>1234</code>
    </div>

    <p class="foot">← <a href="index.html">Volver al sitio</a></p>
  </div>

<script>
  function login() {
    const u = document.getElementById('usuario').value;
    const p = document.getElementById('password').value;
    const err = document.getElementById('error');
    err.style.display = 'none';
    if (u === 'admin' && p === '1234') { window.location.href = 'admin.html'; }
    else { err.innerText = 'Usuario o contraseña incorrectos'; err.style.display = 'block'; }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
