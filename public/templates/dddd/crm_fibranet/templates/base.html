<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CRM Products FibraNet{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__logo">CRM</div>
        <div>
          <h1>CRM Products FibraNet</h1>
          <p>Catálogo comercial de planes, campañas, precios, canales y restricciones</p>
        </div>
      </div>
      <span class="env-badge">Ambiente Demo RPA · Catálogo Comercial</span>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Pantalla preparada para RPA · v1.0</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
